"<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON DASH \ud83d\ude80</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-cyan: #00fff0;
    --neon-pink: #ff006e;
    --neon-yellow: #ffee00;
    --neon-purple: #bf00ff;
    --bg-dark: #060612;
    --bg-mid: #0d0d2b;
  }

  body {
    background: #020208;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
    touch-action: none;
  }

  #gameWrapper {
    position: relative;
    width: 390px;
    height: 700px;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px rgba(0,255,240,0.2), inset 0 0 30px rgba(0,255,240,0.05);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg-dark);
  }

  canvas { display: block; width: 100%; height: 100%; }

  #ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }

  #scoreDisplay {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 42px; font-weight: 900; color: white;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    letter-spacing: 4px; transition: transform 0.1s;
  }
  #scoreDisplay.pop { transform: translateX(-50%) scale(1.3); }

  #bestDisplay {
    position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--neon-cyan); opacity: 0.6; letter-spacing: 3px;
  }

  /* Coin HUD */
  #coinHud {
    position: absolute; top: 16px; left: 16px;
    display: flex; align-items: center; gap: 6px;
    pointer-events: none;
  }
  #coinIcon { font-size: 18px; filter: drop-shadow(0 0 6px #ffee00); }
  #coinCount {
    font-size: 15px; font-weight: 700; color: var(--neon-yellow);
    text-shadow: 0 0 8px var(--neon-yellow); letter-spacing: 2px;
  }
  #coinCount.pop { animation: coinPop 0.25s cubic-bezier(0.34,1.56,0.64,1); }

  /* Coin float text */
  .coinFloat {
    position: absolute; pointer-events: none; z-index: 20;
    font-size: 13px; font-weight: 700; color: var(--neon-yellow);
    text-shadow: 0 0 8px var(--neon-yellow);
    animation: floatUp 0.9s ease-out forwards;
    font-family: 'Orbitron', monospace;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
  }

  #soundToggle {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px; background: transparent;
    border: 1.5px solid rgba(0,255,240,0.4); border-radius: 8px;
    cursor: pointer; pointer-events: all;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s; z-index: 10;
  }
  #soundToggle:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,240,0.3); }
  #soundToggle.muted { opacity: 0.4; }

  /* Shop button */
  #shopBtn {
    position: absolute; bottom: 16px; right: 16px;
    width: 44px; height: 44px; background: transparent;
    border: 1.5px solid rgba(0,255,240,0.4); border-radius: 10px;
    cursor: pointer; pointer-events: all;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: all 0.2s; z-index: 10;
  }
  #shopBtn:hover { border-color: var(--neon-cyan); box-shadow: 0 0 14px rgba(0,255,240,0.4); }

  #comboDisplay {
    position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 700; color: var(--neon-yellow);
    letter-spacing: 3px; opacity: 0; transition: opacity 0.3s;
    text-shadow: 0 0 10px var(--neon-yellow);
  }
  #comboDisplay.show { opacity: 1; }

  .screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: all;
    background: rgba(6,6,18,0.92); backdrop-filter: blur(4px);
  }
  .screen.hidden { display: none; }

  /* \u2500\u2500 START SCREEN \u2500\u2500 */
  #startScreen { gap: 0; }
  .game-title {
    font-size: 52px; font-weight: 900; color: var(--neon-cyan); letter-spacing: 6px;
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    text-align: center; width: 100%;
    animation: titlePulse 2s ease-in-out infinite; margin-bottom: 6px;
  }
  .game-subtitle {
    font-family: 'Rajdhani', sans-serif; font-size: 13px; color: var(--neon-pink);
    letter-spacing: 8px; text-transform: uppercase; margin-bottom: 40px; opacity: 0.9;
  }
  .ship-preview { font-size: 60px; margin-bottom: 30px; animation: float 3s ease-in-out infinite; }
  .tap-hint {
    font-family: 'Rajdhani', sans-serif; font-size: 16px; color: white;
    letter-spacing: 4px; opacity: 0; animation: blink 1.4s ease-in-out infinite; margin-bottom: 40px;
  }
  .instructions {
    font-family: 'Rajdhani', sans-serif; font-size: 13px;
    color: rgba(255,255,255,0.4); letter-spacing: 2px; text-align: center; line-height: 2;
  }

  /* \u2500\u2500 GAME OVER SCREEN \u2500\u2500 */
  #gameOverScreen {
    gap: 8px; background: rgba(4,2,16,0.96);
  }
  #gameOverScreen::before {
    content: ''; position: absolute; inset: 28px 18px; border-radius: 20px;
    border: 1.5px solid var(--neon-pink);
    box-shadow: 0 0 18px rgba(255,0,110,0.45), 0 0 55px rgba(255,0,110,0.15),
                inset 0 0 30px rgba(255,0,110,0.05);
    pointer-events: none;
    animation: panelFlicker 4s ease-in-out infinite;
  }
  @keyframes panelFlicker {
    0%,94%,100% { opacity:1; }
    95%  { opacity:0.65; }
    96%  { opacity:1; }
    97%  { opacity:0.75; }
  }
  .over-label {
    font-size: 11px; color: var(--neon-pink); letter-spacing: 8px; margin-bottom: 6px;
    text-shadow: 0 0 10px var(--neon-pink), 0 0 24px var(--neon-pink);
    animation: labelPulse 2s ease-in-out infinite;
  }
  @keyframes labelPulse {
    0%,100% { opacity:0.8; text-shadow: 0 0 10px var(--neon-pink), 0 0 24px var(--neon-pink); }
    50%      { opacity:1;   text-shadow: 0 0 18px var(--neon-pink), 0 0 50px var(--neon-pink), 0 0 80px rgba(255,0,110,0.4); }
  }
  .over-score {
    font-size: 88px; font-weight: 900; color: var(--neon-pink); line-height: 1; margin-bottom: 4px;
    text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink), 0 0 100px rgba(255,0,110,0.5);
    animation: scoreGlow 1.5s ease-in-out infinite, btnFloat 3s ease-in-out infinite;
  }
  @keyframes scoreGlow {
    0%,100% { text-shadow: 0 0 20px var(--neon-pink), 0 0 50px var(--neon-pink), 0 0 100px rgba(255,0,110,0.5); }
    50%      { text-shadow: 0 0 30px var(--neon-pink), 0 0 70px var(--neon-pink), 0 0 140px rgba(255,0,110,0.7), 0 0 200px rgba(255,0,110,0.25); }
  }
  .over-phrase {
    font-size: 23px; font-weight: 900; color: #ff00cc;
    letter-spacing: 2px; text-align: center; line-height: 1.3;
    text-shadow: 0 0 8px #ff00cc, 0 0 20px #ff00cc, 0 0 45px #cc00ff, 0 0 80px rgba(255,0,204,0.5);
    max-width: 300px; margin-bottom: 10px;
    animation: phrasePulse 1.5s ease-in-out infinite;
  }
  @keyframes phrasePulse {
    0%,100% { text-shadow: 0 0 8px #ff00cc, 0 0 20px #ff00cc, 0 0 45px #cc00ff, 0 0 80px rgba(255,0,204,0.5); }
    50%      { text-shadow: 0 0 14px #ff00ff, 0 0 35px #ff00ff, 0 0 70px #cc00ff, 0 0 120px rgba(255,0,255,0.6), 0 0 180px rgba(200,0,255,0.3); }
  }
  .over-best {
    font-size: 12px; color: var(--neon-yellow); letter-spacing: 4px; margin-bottom: 4px;
    text-shadow: 0 0 8px var(--neon-yellow);
  }
  .over-coins-earned {
    font-size: 13px; color: var(--neon-yellow); letter-spacing: 3px; margin-bottom: 18px;
    opacity: 0.9; font-family: 'Rajdhani', sans-serif;
    text-shadow: 0 0 6px rgba(255,238,0,0.6);
  }
  .new-best-badge {
    background: var(--neon-yellow); color: black; font-size: 10px; font-weight: 700;
    letter-spacing: 3px; padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
    display: none; animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 20px rgba(255,238,0,0.7);
  }
  .restart-btn {
    background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
    font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
    letter-spacing: 4px; padding: 14px 40px; border-radius: 50px; cursor: pointer;
    pointer-events: all; text-transform: uppercase; margin-bottom: 10px;
    text-shadow: 0 0 10px var(--neon-cyan);
    box-shadow: 0 0 16px rgba(0,255,240,0.4), inset 0 0 14px rgba(0,255,240,0.06);
    animation: btnPulse 2s ease-in-out infinite, btnFloat 2.8s ease-in-out infinite;
    transition: background 0.15s, transform 0.15s;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 16px rgba(0,255,240,0.4), inset 0 0 14px rgba(0,255,240,0.06); }
    50%      { box-shadow: 0 0 30px rgba(0,255,240,0.7), 0 0 55px rgba(0,255,240,0.3), inset 0 0 20px rgba(0,255,240,0.1); }
  }
  .restart-btn:active { background: var(--neon-cyan); color: black; transform: scale(0.96); animation: none; }
  @keyframes btnFloat {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-5px); }
  }
  .shop-btn-over {
    background: transparent; border: 1.5px solid rgba(255,238,0,0.6); color: var(--neon-yellow);
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 3px; padding: 10px 30px; border-radius: 50px; cursor: pointer;
    pointer-events: all; text-transform: uppercase;
    text-shadow: 0 0 8px var(--neon-yellow);
    box-shadow: 0 0 12px rgba(255,238,0,0.3), inset 0 0 10px rgba(255,238,0,0.04);
    transition: box-shadow 0.2s, background 0.2s;
    animation: btnFloat 3.4s ease-in-out infinite 0.6s;
  }
  .shop-btn-over:active { background: var(--neon-yellow); color: black; transform: scale(0.96); animation: none; }
  .share3pct-btn {
    background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
    font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 3px; padding: 12px 28px; border-radius: 50px; cursor: pointer;
    pointer-events: all; text-transform: uppercase; margin-bottom: 10px;
    text-shadow: 0 0 10px var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0,255,240,0.5), inset 0 0 16px rgba(0,255,240,0.08);
    transition: background 0.15s, transform 0.15s;
    animation: share3pctPulse 1.5s ease-in-out infinite, btnFloat 3s ease-in-out infinite;
  }
  .share3pct-btn.hidden { display: none; }
  .share3pct-btn:active { background: var(--neon-cyan); color: black; transform: scale(0.96); animation: none; }
  @keyframes share3pctPulse {
    0%,100% { box-shadow: 0 0 20px rgba(0,255,240,0.5), inset 0 0 16px rgba(0,255,240,0.08); }
    50%      { box-shadow: 0 0 40px rgba(0,255,240,0.8), 0 0 70px rgba(0,255,240,0.4), inset 0 0 24px rgba(0,255,240,0.15); }
  }

  /* \u2500\u2500 SHOP SCREEN \u2500\u2500 */
  #shopScreen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(6,6,18,0.97); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center;
    pointer-events: all; z-index: 50; overflow: hidden;
  }
  #shopScreen.hidden { display: none; }

  .shop-header {
    width: 100%; padding: 20px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(0,255,240,0.15);
  }
  .shop-title { font-size: 20px; font-weight: 900; letter-spacing: 4px; color: white; text-shadow: 0 0 10px var(--neon-cyan); }
  .shop-coins {
    display: flex; align-items: center; gap: 6px;
    font-size: 16px; font-weight: 700; color: var(--neon-yellow);
    text-shadow: 0 0 8px var(--neon-yellow);
  }
  .shop-close {
    background: transparent; border: 1.5px solid rgba(0,255,240,0.3); color: var(--neon-cyan);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .shop-close:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,240,0.4); }

  .shop-grid {
    width: 100%; padding: 16px; display: grid;
    grid-template-columns: 1fr 1fr; gap: 12px;
    overflow-y: auto; flex: 1;
    scrollbar-width: none;
  }
  .shop-grid::-webkit-scrollbar { display: none; }

  .ship-card {
    border: 1.5px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 16px 12px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; cursor: pointer;
    transition: all 0.25s; position: relative; overflow: hidden;
    background: rgba(255,255,255,0.02);
  }
  .ship-card:hover { transform: translateY(-2px); }
  .ship-card.owned { border-color: rgba(0,255,240,0.3); }
  .ship-card.selected { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,255,240,0.3), inset 0 0 20px rgba(0,255,240,0.05); }
  .ship-card.locked { opacity: 0.7; }

  .ship-card-canvas { width: 70px; height: 70px; }

  .ship-card-name {
    font-size: 9px; font-weight: 700; letter-spacing: 2px; color: white;
    text-align: center; text-transform: uppercase;
  }

  .ship-card-badge {
    font-size: 9px; letter-spacing: 2px; padding: 3px 10px; border-radius: 20px;
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
  }
  .badge-selected { background: var(--neon-cyan); color: #060612; }
  .badge-owned { background: rgba(0,255,240,0.15); color: var(--neon-cyan); border: 1px solid rgba(0,255,240,0.3); }
  .badge-price {
    background: rgba(255,238,0,0.1); color: var(--neon-yellow);
    border: 1px solid rgba(255,238,0,0.3);
    display: flex; align-items: center; gap: 4px;
  }
  .badge-price.affordable { background: rgba(255,238,0,0.2); border-color: rgba(255,238,0,0.6); }
  .badge-locked { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.1); }

  .selected-indicator {
    position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan);
  }

  /* Unlock animation */
  .ship-card.unlocking { animation: unlockPulse 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes unlockPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(0,255,240,0.6); }
    100% { transform: scale(1); }
  }

  #flashOverlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; opacity: 0; border-radius: 20px; transition: opacity 0.05s; z-index: 5;
  }
  #fluctNotif {
    position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%);
    font-size: 18px; font-weight: 900; letter-spacing: 5px;
    pointer-events: none; z-index: 7; white-space: nowrap;
    opacity: 0; transition: opacity 0.35s ease;
  }
  #fluctNotif.show { opacity: 1; }
  #phaseIndicator {
    position: absolute; top: 14px; right: 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    pointer-events: none; z-index: 7; white-space: nowrap;
    opacity: 0; transition: opacity 0.6s ease, color 0.6s ease, text-shadow 0.6s ease;
  }
  #phaseIndicator.show { opacity: 0.55; }

  #speedNotif {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 48px; font-weight: 700;
    background: linear-gradient(90deg, #ffe600, #ff8c00, #ffe600);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    filter: drop-shadow(0 0 12px #ffaa00) drop-shadow(0 0 28px #ff6600);
    pointer-events: none; z-index: 6; white-space: nowrap;
    display: none;
  }

  @keyframes titlePulse {
    0%,100% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
    50% { text-shadow: 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-cyan), 0 0 120px rgba(0,255,240,0.4); }
  }
  @keyframes float { 0%,100% { transform: translateY(0px) rotate(-5deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
  @keyframes blink { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes badgePop { 0% { transform: scale(0) rotate(-10deg); } 100% { transform: scale(1) rotate(0deg); } }

  @keyframes coinPop { 0% { transform:scale(1); } 50% { transform:scale(1.5); } 100% { transform:scale(1); } }

  /* ── SCORE 15 ACHIEVEMENT OVERLAY ── */
  #achieve15 {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 200;
    opacity: 0; transition: opacity 0.25s ease;
    background: radial-gradient(ellipse at center, rgba(0,255,240,0.08) 0%, rgba(0,0,0,0.72) 70%);
  }
  #achieve15.show { opacity: 1; }
  #achieve15 .achieve-text {
    font-size: clamp(28px, 8vw, 52px); font-weight: 900;
    letter-spacing: 4px; text-align: center;
    color: #ffffff;
    text-shadow:
      0 0 10px #fff,
      0 0 25px #00fff0,
      0 0 55px #00fff0,
      0 0 100px rgba(0,255,240,0.6);
    animation: achieve15Pulse 0.5s ease-in-out infinite alternate;
    line-height: 1.2;
  }
  @keyframes achieve15Pulse {
    0%   { text-shadow: 0 0 10px #fff, 0 0 25px #00fff0, 0 0 55px #00fff0, 0 0 100px rgba(0,255,240,0.5); transform: scale(1); }
    100% { text-shadow: 0 0 20px #fff, 0 0 50px #00fff0, 0 0 100px #00fff0, 0 0 180px rgba(0,255,240,0.8); transform: scale(1.04); }
  }

  /* ── REPLAY OVERLAY ── */
  #replayOverlay { gap: 14px; padding: 20px; z-index: 80; }

  #replayVideo {
    width: 100%; max-height: 62%;
    border-radius: 14px;
    border: 2px solid rgba(255,0,110,0.6);
    box-shadow: 0 0 40px rgba(255,0,110,0.4), 0 0 80px rgba(191,0,255,0.2);
    background: #000; display: block; object-fit: cover;
  }

  .replay-btn {
    background: rgba(255,0,110,0.1); border: 2px solid var(--neon-pink);
    color: var(--neon-pink); font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 900; letter-spacing: 4px;
    padding: 12px 36px; border-radius: 50px; cursor: pointer;
    pointer-events: all;
    box-shadow: 0 0 20px rgba(255,0,110,0.3);
    animation: btnFloat 3.6s ease-in-out infinite 0.4s;
    transition: background 0.15s, transform 0.15s;
  }
  .replay-btn:active { background: var(--neon-pink); color: #020208; transform: scale(0.96); }

  #shareTiktokBtn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; max-width: 300px;
    background: linear-gradient(135deg, #ff006e, #bf00ff);
    color: white; border: none; border-radius: 50px; cursor: pointer;
    font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 900;
    letter-spacing: 3px; padding: 14px 28px;
    box-shadow: 0 0 30px rgba(255,0,110,0.6), 0 0 60px rgba(191,0,255,0.3);
    transition: transform 0.15s;
    pointer-events: all;
    animation: tiktokPulse 1.2s ease-in-out infinite;
  }
  @keyframes tiktokPulse {
    0%,100% { box-shadow: 0 0 30px rgba(255,0,110,0.6), 0 0 60px rgba(191,0,255,0.3); }
    50%      { box-shadow: 0 0 55px rgba(255,0,110,0.95), 0 0 100px rgba(191,0,255,0.6), 0 0 140px rgba(255,0,110,0.25); }
  }
  #shareTiktokBtn:active { transform: scale(0.96); animation: none; box-shadow: 0 0 60px rgba(255,0,110,0.9); }

  .rv-play-again {
    background: transparent; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); font-family: 'Orbitron', monospace;
    font-size: 10px; letter-spacing: 2px; padding: 6px;
    transition: color 0.2s; pointer-events: all;
  }
  .rv-play-again:hover { color: white; }

  @media (max-width: 420px) {
    #gameWrapper { width:100vw; height:100vh; border-radius:0; border:none; }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="scoreDisplay">0</div>
    <div id="bestDisplay">BEST: 0</div>
    <div id="comboDisplay">x2 COMBO!</div>

function loadSave() {

      coins: s.coins || 0,

}

// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  AUDIO ENGINE
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
const AudioEngine = (() => {
  let ctx = null, masterGain = null, muted = false, musicPlaying = false, musicTimer = null;
  let nextBarTime = 0, barCount = 0, musicGain = null, musicDelayFb = null;

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain(); masterGain.gain.value = 0.6; masterGain.connect(ctx.destination);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function setMuted(v) { muted = v; if (masterGain) masterGain.gain.value = muted ? 0 : 0.6; }
  function isMuted() { return muted; }

  function playTone({ type='sine', freq, freqEnd, startTime, duration, gainPeak=0.4, gainStart=0 }) {
    if (!ctx || muted) return;
    const now = startTime !== undefined ? startTime : ctx.currentTime;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== undefined) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
    g.gain.setValueAtTime(gainStart, now);
    g.gain.linearRampToValueAtTime(gainPeak, now + duration * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + duration + 0.05);
  }
  function playNoise(startTime, duration=0.3, gainPeak=0.3) {
    if (!ctx || muted) return;
    const buf = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; flt.type = 'bandpass'; flt.frequency.value = 200; flt.Q.value = 0.5;
    g.gain.setValueAtTime(gainPeak, startTime); g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    src.connect(flt); flt.connect(g); g.connect(masterGain); src.start(startTime); src.stop(startTime + duration);
  }

  function playJump() { init(); resume(); playTone({type:'square',freq:280,freqEnd:520,duration:0.12,gainPeak:0.25}); playTone({type:'sine',freq:420,freqEnd:800,duration:0.1,gainPeak:0.15}); }
  function playScore() { init(); resume(); const t=ctx.currentTime; playTone({type:'sine',freq:660,duration:0.15,gainPeak:0.3,startTime:t}); playTone({type:'sine',freq:880,duration:0.15,gainPeak:0.2,startTime:t+0.05}); playTone({type:'triangle',freq:1100,duration:0.2,gainPeak:0.15,startTime:t+0.1}); }
  function playCoin() { init(); resume(); playTone({type:'sine',freq:1200,freqEnd:1600,duration:0.08,gainPeak:0.2}); }
  function playCombo() { init(); resume(); const t=ctx.currentTime; [523,659,784,1047].forEach((f,i)=>playTone({type:'sine',freq:f,duration:0.15,gainPeak:0.3,startTime:t+i*0.07})); }
  function playSpeedUp() { init(); resume(); const t=ctx.currentTime; playTone({type:'sawtooth',freq:200,freqEnd:800,duration:0.4,gainPeak:0.35,startTime:t}); playTone({type:'sine',freq:1200,freqEnd:2400,duration:0.3,gainPeak:0.2,startTime:t+0.1}); }
  function playDeath() {
    init(); resume();
    const t = ctx.currentTime;
    const dG = ctx.createGain(); dG.gain.value = 0.8; dG.connect(masterGain);

    // ── Layer 1: Deep bass BOOM ──
    // Sub-bass punch — hits hard then decays
    [40, 55, 70].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq * 1.8, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + 0.5);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.7 - i * 0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.connect(g); g.connect(dG); osc.start(t); osc.stop(t + 1.25);
    });

    // ── Layer 2: Explosion noise body ──
    // Full-spectrum burst that rolls off
    const expLen = Math.floor(ctx.sampleRate * 2.0);
    const expBuf = ctx.createBuffer(1, expLen, ctx.sampleRate);
    const expData = expBuf.getChannelData(0);
    for (let i = 0; i < expLen; i++) expData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / expLen, 0.4);
    const expSrc = ctx.createBufferSource();
    const expLpf = ctx.createBiquadFilter(); expLpf.type = 'lowpass'; expLpf.frequency.value = 1800;
    const expG = ctx.createGain();
    expG.gain.setValueAtTime(0.9, t); expG.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    expSrc.buffer = expBuf; expSrc.connect(expLpf); expLpf.connect(expG); expG.connect(dG);
    expSrc.start(t); expSrc.stop(t + 2.0);

    // ── Layer 3: High-pitched CRASH ──
    // Metallic crash — white noise through highpass
    const crLen = Math.floor(ctx.sampleRate * 0.6);
    const crBuf = ctx.createBuffer(1, crLen, ctx.sampleRate);
    const crData = crBuf.getChannelData(0);
    for (let i = 0; i < crLen; i++) crData[i] = Math.random() * 2 - 1;
    const crSrc = ctx.createBufferSource();
    const crHpf = ctx.createBiquadFilter(); crHpf.type = 'highpass'; crHpf.frequency.value = 6000;
    const crG = ctx.createGain();
    crG.gain.setValueAtTime(0.55, t); crG.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    crSrc.buffer = crBuf; crSrc.connect(crHpf); crHpf.connect(crG); crG.connect(dG);
    crSrc.start(t); crSrc.stop(t + 0.6);

    // ── Layer 4: Descending frequency sweep ──
    // Sawtooth power sweep — spaceship tearing apart
    const swp = ctx.createOscillator(), swpG = ctx.createGain();
    const swpDist = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i * 2 / 256 - 1; curve[i] = (Math.PI + 280) * x / (Math.PI + 280 * Math.abs(x)); }
    swpDist.curve = curve;
    swp.type = 'sawtooth';
    swp.frequency.setValueAtTime(900, t);
    swp.frequency.exponentialRampToValueAtTime(30, t + 1.4);
    swpG.gain.setValueAtTime(0, t);
    swpG.gain.linearRampToValueAtTime(0.45, t + 0.04);
    swpG.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    swp.connect(swpDist); swpDist.connect(swpG); swpG.connect(dG);
    swp.start(t); swp.stop(t + 1.45);

    // ── Layer 5: Debris rattles — short metallic pings ──
    [0.05, 0.12, 0.22, 0.38, 0.55].forEach((delay, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800 - i * 120, t + delay);
      osc.frequency.exponentialRampToValueAtTime(100 + i * 30, t + delay + 0.18);
      g.gain.setValueAtTime(0.18 - i * 0.025, t + delay);
      g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.2);
      osc.connect(g); g.connect(dG); osc.start(t + delay); osc.stop(t + delay + 0.22);
    });
  }
  function playNewRecord() { init(); resume(); const t=ctx.currentTime; [523,659,784,1047,1319].forEach((f,i)=>{ playTone({type:'triangle',freq:f,duration:0.2,gainPeak:0.35,startTime:t+i*0.1}); }); }
  function playUnlock() { init(); resume(); const t=ctx.currentTime; [400,600,800,1200].forEach((f,i)=>playTone({type:'sine',freq:f,duration:0.18,gainPeak:0.3,startTime:t+i*0.08})); }

  function playMockLaugh() {
    if(!ctx||muted) return;
    const t = ctx.currentTime;

    // Helper: one voiced burst (sawtooth+bandpass) + upper harmonic
    function burst(lG, delay, freq, formant, dur, peakGain, harmMult) {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      const bpf = ctx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t + delay);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.80, t + delay + dur);
      bpf.type = 'bandpass'; bpf.frequency.value = formant; bpf.Q.value = 2.4;
      g.gain.setValueAtTime(0, t + delay);
      g.gain.linearRampToValueAtTime(peakGain, t + delay + 0.016);
      g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
      osc.connect(bpf); bpf.connect(g); g.connect(lG);
      osc.start(t + delay); osc.stop(t + delay + dur + 0.02);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(freq * harmMult, t + delay);
      o2.frequency.exponentialRampToValueAtTime(freq * harmMult * 0.88, t + delay + dur);
      g2.gain.setValueAtTime(0, t + delay);
      g2.gain.linearRampToValueAtTime(peakGain * 0.3, t + delay + 0.016);
      g2.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
      o2.connect(g2); g2.connect(lG);
      o2.start(t + delay); o2.stop(t + delay + dur + 0.02);
    }

    const variants = [
      // 0 — classic "HA HA HA heh" (mid pitch, 4 bursts)
      () => {
        const lG = ctx.createGain(); lG.gain.value = 0.38; lG.connect(masterGain);
        [0, 0.21, 0.42, 0.60].forEach((d, i) => {
          const isTrail = i === 3;
          burst(lG, d, 310 - i*8, 1050, isTrail?0.38:0.17, isTrail?0.7:0.9, 2.1);
        });
      },
      // 1 — high-pitched cackle "hee hee hee hee hee" (5 rapid short bursts)
      () => {
        const lG = ctx.createGain(); lG.gain.value = 0.36; lG.connect(masterGain);
        [0, 0.14, 0.28, 0.42, 0.54].forEach((d, i) => {
          burst(lG, d, 420 - i*6, 1400, 0.13, 0.85, 2.5);
        });
      },
      // 2 — slow deep villainous "hah... hah... hah" (3 wide-spaced heavy bursts)
      () => {
        const lG = ctx.createGain(); lG.gain.value = 0.42; lG.connect(masterGain);
        [0, 0.32, 0.64].forEach((d, i) => {
          burst(lG, d, 200 - i*10, 780, 0.28, 0.95, 1.8);
        });
      },
      // 3 — snickering "heh heh" (2 quick low snorts + rising whimper)
      () => {
        const lG = ctx.createGain(); lG.gain.value = 0.40; lG.connect(masterGain);
        [0, 0.18].forEach((d) => {
          burst(lG, d, 240, 900, 0.16, 0.88, 1.9);
        });
        // rising whimper tail
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, t + 0.40);
        osc.frequency.exponentialRampToValueAtTime(520, t + 0.40 + 0.35);
        g.gain.setValueAtTime(0, t + 0.40);
        g.gain.linearRampToValueAtTime(0.55, t + 0.40 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.40 + 0.35);
        const bpf = ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=1100; bpf.Q.value=2.0;
        osc.connect(bpf); bpf.connect(g); g.connect(lG);
        osc.start(t + 0.40); osc.stop(t + 0.40 + 0.37);
      },
      // 4 — maniacal rapid-fire "ha ha ha ha ha ha" (6 very short staccato bursts, ascending)
      () => {
        const lG = ctx.createGain(); lG.gain.value = 0.34; lG.connect(masterGain);
        [0, 0.11, 0.22, 0.33, 0.44, 0.55].forEach((d, i) => {
          burst(lG, d, 290 + i*14, 1100, 0.10, 0.9, 2.2);
        });
      },
    ];

    variants[Math.floor(Math.random() * variants.length)]();
  }

  // ── Music helpers (route through musicGain → masterGain) ──
  function mT(freq, st, dur, type, peak) {
    if(!ctx||muted||!musicGain) return;
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.value=freq;
    g.gain.setValueAtTime(0,st);
    g.gain.linearRampToValueAtTime(peak,st+dur*0.06);
    g.gain.exponentialRampToValueAtTime(0.001,st+dur);
    osc.connect(g); g.connect(musicGain); osc.start(st); osc.stop(st+dur+0.02);
  }
  function mN(st, dur, peak, ftype, ffreq) {
    if(!ctx||muted||!musicGain) return;
    const len=Math.floor(ctx.sampleRate*Math.min(dur,1));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(), flt=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=buf; flt.type=ftype; flt.frequency.value=ffreq;
    g.gain.setValueAtTime(peak,st); g.gain.exponentialRampToValueAtTime(0.001,st+dur);
    src.connect(flt); flt.connect(g); g.connect(musicGain); src.start(st); src.stop(st+dur);
  }

  // ── Chiptune track: 150 BPM, A-minor, 4-bar loop ──
  const Cb=60/150, Ce=Cb/2, Cs=Cb/4, CBAR=Cb*4;

  // 4-bar melody (square wave lead, each row = 8 eighth notes)
  const MELO=[
    [659,659,880,784,659,587,659,523],  // bar 0: hook — soars to A5
    [440,523,587,659,698,659,587,523],  // bar 1: fill — ascending
    [587,659,698,659,587,523,494,440],  // bar 2: response — descends
    [659,587,523,494,440,392,440,330],  // bar 3: resolve — lands home
  ];
  // 4-bar bass (sawtooth, 8 eighth notes, 0 = rest)
  const BASS=[
    [110,0,110,0,165,0,131,0],   // Am
    [87, 0,87,110,98, 0,98,123], // F → C
    [98, 0,98,123,147,0,110,0],  // G → Dm
    [110,0,131,0,165,110,98,82], // Am fill
  ];
  // 4-bar arpeggio (triangle, 16 sixteenth notes per bar)
  const ARPS=[
    [220,330,440,550,440,330,220,330,220,330,440,550,660,550,440,330], // Am
    [175,262,349,523,349,262,175,262,196,294,392,523,392,294,196,262], // F→G
    [196,294,392,523,392,294,196,294,220,330,440,523,440,330,220,330], // G→Dm
    [220,330,440,660,440,330,220,330,165,247,330,440,330,247,165,220], // Am→Em
  ];

  function scheduleBar(st) {
    const bar=barCount%4; barCount++;

    // Kick: beats 1+3; bar 3 adds pickup on beat 3.75
    const kicks=bar===3?[0,2,2.75]:[0,2];
    kicks.forEach(i=>{ mT(82,st+i*Cb,0.25,'sine',0.42); mT(96,st+i*Cb,0.12,'sine',0.22); mN(st+i*Cb,0.05,0.2,'lowpass',260); });

    // Snare: beats 2+4
    [1,3].forEach(i=>{ mN(st+i*Cb,0.13,0.24,'bandpass',1350); mT(185,st+i*Cb,0.07,'triangle',0.13); });

    // Hi-hats: every 8th; 16th layer on bars 1 & 3 for extra drive
    for(let i=0;i<8;i++) mN(st+i*Ce,0.03,i%2===0?0.09:0.045,'highpass',11000);
    if(bar===1||bar===3) for(let i=0;i<16;i++) { if(i%2!==0) mN(st+i*Cs,0.018,0.022,'highpass',13500); }

    // Sub-bass pulse on beat 1 (body)
    mT(55,st,Cb*0.45,'sine',0.14);

    // Bass line
    BASS[bar].forEach((f,i)=>{ if(f) mT(f,st+i*Ce,Ce*0.65,'sawtooth',0.2); });

    // Melody (square — classic chiptune lead)
    MELO[bar].forEach((f,i)=>mT(f,st+i*Ce,Ce*0.42,'square',0.06));

    // Arpeggio sparkle (triangle)
    ARPS[bar].forEach((f,i)=>mT(f,st+i*Cs,Cs*0.5,'triangle',0.03));

    // Chord pad stab on beat 1 (bars 0 & 2 only — keeps breathing room)
    if(bar===0||bar===2){
      const chords=bar===0?[220,330,440]:[196,294,392];
      chords.forEach(f=>mT(f,st,Cb*1.8,'triangle',0.022));
    }
  }

  function scheduleLoop() {
    if(!musicPlaying) return;
    while(nextBarTime < ctx.currentTime+1.5) { scheduleBar(nextBarTime); nextBarTime+=CBAR; }
    musicTimer=setTimeout(scheduleLoop,300);
  }
  function startMusic() {
    if(!ctx) init(); resume();
    if(musicPlaying) return;
    musicGain=ctx.createGain(); musicGain.gain.value=0.82;
    // Low-pass filter: cuts highs above 800Hz, keeps bass/mids
    const lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=800; lpf.Q.value=0.8;
    musicGain.connect(lpf);
    // Delay effect: 0.3s, 0.4 feedback, parallel wet/dry
    const delay=ctx.createDelay(1.0); delay.delayTime.value=0.3;
    musicDelayFb=ctx.createGain(); musicDelayFb.gain.value=0.4;
    const wet=ctx.createGain(); wet.gain.value=0.28;
    lpf.connect(masterGain);                                // dry
    lpf.connect(delay);                                     // delay input
    delay.connect(musicDelayFb); musicDelayFb.connect(delay); // feedback loop
    delay.connect(wet); wet.connect(masterGain);            // wet out
    barCount=0; musicPlaying=true; nextBarTime=ctx.currentTime+0.05;
    scheduleLoop();
  }
  function stopMusic() {
    musicPlaying=false;
    if(musicTimer) clearTimeout(musicTimer);
    // Instantly silence any still-playing scheduled notes
    if(musicGain && ctx) {
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(0, ctx.currentTime);
    }
    try { if(musicDelayFb) musicDelayFb.disconnect(); } catch(e){}
    musicGain=null; musicDelayFb=null;
  }
  function setMusicPhase(p) {} // no-op — single energetic track

  return { init, resume, setMuted, isMuted, playJump, playScore, playCoin, playCombo, playSpeedUp, playDeath, playNewRecord, playUnlock, playMockLaugh, startMusic, stopMusic, setMusicPhase };
})();

function doJump() {
  AudioEngine.init(); AudioEngine.resume();

  if (state === 'playing' && !player.dead) {
    player.vy = player.jumpForce;
    AudioEngine.playJump();
    spawnParticles(player.x, player.y, currentShip().trailColor, 5, 0.6);
  }
}

// \u2500\u2500 Game lifecycle \u2500\u2500
function startGame() {
  state='playing'; score=0; frame=0; speed=5.45; barriers=[]; particles=[]; coinPickups=[]; combo=0; coinsThisRun=0;
  speedMult=1.0; targetSpeedMult=1.0; slowMoMult=1.0; targetSlowMoMult=1.0; scorePhase=-1;
  momentBlob=null; reached8=false; MomentRecorder.stop();

  fluctNotif.classList.remove('show');
  phaseIndicator.classList.remove('show');
  resetPlayer(); updateUI();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('shopScreen').classList.add('hidden');
  const rv = document.getElementById('replayVideo');
  rv.pause(); rv.src = '';
  document.getElementById('replayOverlay').classList.add('hidden');
  Replay.reset();
  spawnBarrier();
  AudioEngine.startMusic();
  updateStartShipEmoji();
  Replay.start(canvas);
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('bestDisplay').textContent = 'BEST: ' + save.best;
  updateCoinHud();
}

function awardCoins(amount, x, y) {
  save.coins += amount;
  coinsThisRun += amount;
  writeSave(save);
  updateCoinHud();
  popCoin();
  AudioEngine.playCoin();
  if (x !== undefined) showCoinFloat(x, y, amount);
}

function gameOver() {
  state='dead'; player.dead=true;
  const clipPromise = Replay.stop();
  AudioEngine.stopMusic(); AudioEngine.playDeath();
  flashScreen('#ff006e', 0.7); triggerShake(12);
  spawnParticles(player.x,player.y,'#ff006e',30,1.5);
  spawnParticles(player.x,player.y,'#ffee00',15,1.2);

  if (score > save.best) {
    save.best = score; writeSave(save);
    document.getElementById('newBestBadge').style.display='block';
    setTimeout(()=>AudioEngine.playNewRecord(),800);
  } else { document.getElementById('newBestBadge').style.display='none'; }

  // Bonus monedas por puntuaci\u00f3n
  const bonus = Math.floor(score / 5);
  if (bonus > 0) awardCoins(bonus);

  document.getElementById('finalScore').textContent = score;
  const deathPhrase = getDeathPhrase(score);
  document.getElementById('overPhrase').textContent = deathPhrase;
  setTimeout(() => AudioEngine.playMockLaugh(), 400);
  document.getElementById('overBest').textContent = 'BEST: ' + save.best;
  document.getElementById('overCoinsEarned').textContent = `+${coinsThisRun + bonus} \u25cf COINS`;
  clipPromise.then(blob => { lastClipBlob = blob; });
  MomentRecorder.stop().then(blob => { if (blob) momentBlob = blob; });
  const share3btn = document.getElementById('share3pctBtn');
  share3btn.classList.toggle('hidden', !reached8);
  setTimeout(() => { document.getElementById('gameOverScreen').classList.remove('hidden'); }, 700);
}

function openShop() {
  AudioEngine.init(); AudioEngine.resume();
  renderShop();
  document.getElementById('shopScreen').classList.remove('hidden');
}
function closeShop() {
  document.getElementById('shopScreen').classList.add('hidden');
  updateStartShipEmoji();
}

function updateStartShipEmoji() {
  document.getElementById('startShipEmoji').textContent = currentShip().emoji;
}

function renderShop() {
  updateCoinHud();
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';

  SHIPS.forEach(ship => {
    const owned = save.owned.includes(ship.id);
    const selected = save.selected === ship.id;
    const affordable = save.coins >= ship.price;

    const card = document.createElement('div');
    card.className = `ship-card ${owned ? 'owned' : 'locked'} ${selected ? 'selected' : ''}`;
    card.dataset.id = ship.id;

    // Mini canvas preview
    const miniCanvas = document.createElement('canvas');
    miniCanvas.className = 'ship-card-canvas';
    miniCanvas.width = 70; miniCanvas.height = 70;
    drawShipPreview(miniCanvas, ship, selected);
    card.appendChild(miniCanvas);

    // Name
    const nameEl = document.createElement('div');
    nameEl.className = 'ship-card-name';
    nameEl.textContent = ship.name;
    card.appendChild(nameEl);

    // Badge
    const badge = document.createElement('div');
    badge.className = 'ship-card-badge';
    if (selected) { badge.classList.add('badge-selected'); badge.textContent = '\u2713 ACTIVE'; }
    else if (owned) { badge.classList.add('badge-owned'); badge.textContent = 'SELECT'; }
    else if (ship.price === 0) { badge.classList.add('badge-owned'); badge.textContent = 'FREE'; }
    else {
      badge.classList.add('badge-price');
      if (affordable) badge.classList.add('affordable');
      badge.innerHTML = `\u25cf ${ship.price}`;
    }
    card.appendChild(badge);

    if (selected) { const dot = document.createElement('div'); dot.className='selected-indicator'; card.appendChild(dot); }

    card.addEventListener('click', () => onShipCardClick(ship, card));
    grid.appendChild(card);

    // Animate previews
    animateShipPreview(miniCanvas, ship);
  });
}

// Dibuja la nave en el mini canvas
function drawShipPreview(c, ship, selected) {
  const gfx = c.getContext('2d');
  const cx = 35, cy = 35, size = 16;
  gfx.clearRect(0, 0, 70, 70);

  // Glow de fondo si seleccionada
  if (selected) {
    const bg = gfx.createRadialGradient(cx,cy,0,cx,cy,30);
    bg.addColorStop(0, `${ship.color}22`); bg.addColorStop(1,'transparent');
    gfx.fillStyle=bg; gfx.fillRect(0,0,70,70);
  }

  gfx.shadowColor = ship.glowColor; gfx.shadowBlur = 15;
  gfx.save(); gfx.translate(cx, cy);

  // Rainbow mode para LEGEND
  const bodyColor = ship.rainbow ? getRainbow(Date.now()*0.002) : ship.color;

  // Cuerpo
  gfx.fillStyle = bodyColor; gfx.beginPath(); gfx.ellipse(0,0,size*0.5,size,0,0,Math.PI*2); gfx.fill();
  // Cabina
  gfx.fillStyle='#ffffff'; gfx.beginPath(); gfx.moveTo(0,-size); gfx.lineTo(-size*0.4,-size*0.3); gfx.lineTo(size*0.4,-size*0.3); gfx.closePath(); gfx.fill();
  // Alas
  gfx.fillStyle = ship.wingColor;
  gfx.beginPath(); gfx.moveTo(-size*0.4,size*0.3); gfx.lineTo(-size*1.1,size*0.9); gfx.lineTo(-size*0.4,size*0.7); gfx.closePath(); gfx.fill();
  gfx.beginPath(); gfx.moveTo(size*0.4,size*0.3); gfx.lineTo(size*1.1,size*0.9); gfx.lineTo(size*0.4,size*0.7); gfx.closePath(); gfx.fill();
  // Llama
  const fg = gfx.createRadialGradient(0,size+6,0,0,size,12);
  fg.addColorStop(0,ship.flameColors[0]); fg.addColorStop(0.4,ship.flameColors[1]); fg.addColorStop(0.8,ship.flameColors[2]); fg.addColorStop(1,'transparent');
  gfx.fillStyle=fg; gfx.beginPath(); gfx.ellipse(0,size+5,size*0.25,10,0,0,Math.PI*2); gfx.fill();

  // Lock overlay
  if (!save.owned.includes(ship.id)) {
    gfx.restore();
    gfx.fillStyle='rgba(6,6,18,0.55)'; gfx.fillRect(0,0,70,70);
    gfx.fillStyle='rgba(255,255,255,0.5)'; gfx.font='bold 22px serif'; gfx.textAlign='center'; gfx.textBaseline='middle'; gfx.fillText('\ud83d\udd12',35,35);
  } else {
    gfx.restore();
  }
}

const previewAnimations = new Map();
function animateShipPreview(c, ship) {
  let flicker = 0;
  function frame() {
    if (!c.isConnected) return;
    flicker += 0.15;
    const gfx = c.getContext('2d');
    const cx=35, cy=35, size=16;
    gfx.clearRect(0,0,70,70);
    const selected = save.selected === ship.id;
    if (selected) {
      const bg=gfx.createRadialGradient(cx,cy,0,cx,cy,30);
      bg.addColorStop(0,`${ship.color}22`); bg.addColorStop(1,'transparent');
      gfx.fillStyle=bg; gfx.fillRect(0,0,70,70);
    }
    gfx.shadowColor=ship.glowColor; gfx.shadowBlur=15;
    gfx.save(); gfx.translate(cx,cy);

    const bodyColor = ship.rainbow ? getRainbow(Date.now()*0.002) : ship.color;

    gfx.fillStyle=bodyColor; gfx.beginPath(); gfx.ellipse(0,0,size*0.5,size,0,0,Math.PI*2); gfx.fill();
    gfx.fillStyle='#ffffff'; gfx.beginPath(); gfx.moveTo(0,-size); gfx.lineTo(-size*0.4,-size*0.3); gfx.lineTo(size*0.4,-size*0.3); gfx.closePath(); gfx.fill();
    gfx.fillStyle=ship.wingColor;
    gfx.beginPath(); gfx.moveTo(-size*0.4,size*0.3); gfx.lineTo(-size*1.1,size*0.9); gfx.lineTo(-size*0.4,size*0.7); gfx.closePath(); gfx.fill();
    gfx.beginPath(); gfx.moveTo(size*0.4,size*0.3); gfx.lineTo(size*1.1,size*0.9); gfx.lineTo(size*0.4,size*0.7); gfx.closePath(); gfx.fill();
    const fs=8+Math.sin(flicker)*3;
    const fg=gfx.createRadialGradient(0,size+fs*0.4,0,0,size,fs*1.5);
    fg.addColorStop(0,ship.flameColors[0]); fg.addColorStop(0.3,ship.flameColors[1]); fg.addColorStop(0.7,ship.flameColors[2]); fg.addColorStop(1,'transparent');
    gfx.fillStyle=fg; gfx.beginPath(); gfx.ellipse(0,size+fs*0.4,size*0.25,fs,0,0,Math.PI*2); gfx.fill();

    if (!save.owned.includes(ship.id)) {
      gfx.restore();
      gfx.fillStyle='rgba(6,6,18,0.55)'; gfx.fillRect(0,0,70,70);
      gfx.font='bold 22px serif'; gfx.textAlign='center'; gfx.textBaseline='middle'; gfx.fillText('\ud83d\udd12',35,35);
    } else { gfx.restore(); }

    requestAnimationFrame(frame);
  }
  frame();
}

function onShipCardClick(ship, card) {
  const owned = save.owned.includes(ship.id);
  if (owned || ship.price === 0) {
    // Select
    save.selected = ship.id;
    writeSave(save);
    AudioEngine.init(); AudioEngine.resume();
    AudioEngine.playScore();
    renderShop();
  } else if (save.coins >= ship.price) {
    // Buy
    save.coins -= ship.price;
    save.owned.push(ship.id);
    save.selected = ship.id;
    writeSave(save);
    AudioEngine.playUnlock();
    card.classList.add('unlocking');
    flashScreen(ship.color, 0.3);
    setTimeout(()=>renderShop(), 200);
  } else {
    // Can't afford \u2014 shake card
    card.style.animation = 'none'; void card.offsetWidth;
    card.style.animation = 'shake 0.3s ease';
    setTimeout(()=>{ card.style.animation=''; },300);
  }
}

function getRainbow(t) {
  const r=Math.sin(t)*127+128, g=Math.sin(t+2)*127+128, b=Math.sin(t+4)*127+128;
  return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
}

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
//  DRAW FUNCTIONS
// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function drawBackground() {
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#060612'); grad.addColorStop(1,'#0d0d2b');
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  nebula.forEach(n=>{
    const ng=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    ng.addColorStop(0,`hsla(${n.hue},80%,50%,${n.opacity})`); ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle='rgba(0,255,240,0.03)'; ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  stars.forEach(s=>{
    const tw=0.5+0.5*Math.sin(s.twinkle+frame*0.03);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.8+0.2*tw),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.opacity*tw})`;ctx.fill();
  });
}

function drawCoinPickups() {
  coinPickups.forEach(c => {
    if (c.collected) return;
    c.spin += 0.08;
    const squish = Math.abs(Math.cos(c.spin));
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.shadowColor='#ffee00'; ctx.shadowBlur=15;
    // Coin body
    const cg=ctx.createRadialGradient(0,0,0,0,0,c.r);
    cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.4,'#ffee00'); cg.addColorStop(1,'#cc8800');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.ellipse(0,0,c.r*(0.3+0.7*squish),c.r,0,0,Math.PI*2); ctx.fill();
    // \u25cf symbol
    if(squish>0.3){
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.font=`bold ${c.r}px Orbitron`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('\u25cf',0,1);
    }
    ctx.shadowBlur=0; ctx.restore();
  });
}

function drawBarrier(b) {
  ctx.shadowColor=`hsl(${b.hue},100%,60%)`; ctx.shadowBlur=25;
  ctx.fillStyle=`hsl(${b.hue},60%,10%)`;
  ctx.fillRect(b.x,0,BAR_W,b.topH); ctx.fillRect(b.x,b.bottomY,BAR_W,canvas.height-b.bottomY);
  ctx.strokeStyle=`hsl(${b.hue},100%,60%)`; ctx.lineWidth=2;
  ctx.strokeRect(b.x,0,BAR_W,b.topH); ctx.strokeRect(b.x,b.bottomY,BAR_W,canvas.height-b.bottomY);
  ctx.shadowBlur=35; ctx.fillStyle=`hsl(${b.hue},100%,70%)`;
  ctx.fillRect(b.x-4,b.topH-12,BAR_W+8,12); ctx.fillRect(b.x-4,b.bottomY,BAR_W+8,12);
  ctx.shadowBlur=0;
  ctx.strokeStyle=`hsla(${b.hue},100%,80%,0.3)`; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(b.x+BAR_W/2,0);ctx.lineTo(b.x+BAR_W/2,b.topH-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(b.x+BAR_W/2,b.bottomY+12);ctx.lineTo(b.x+BAR_W/2,canvas.height);ctx.stroke();
  ctx.shadowBlur=0;
}


function drawPlayer() {
  if (player.dead) return;
  const ship = currentShip();

  // Trail
  player.trail.forEach((t,i)=>{
    const progress=i/player.trail.length;
    const alpha=progress*0.5, size=player.size*progress*0.9;
    ctx.beginPath(); ctx.arc(t.x,t.y,size,0,Math.PI*2);
    ctx.fillStyle=`rgba(${hexToRgb(ship.trailColor)},${alpha})`; ctx.fill();
  });

  ctx.shadowColor=ship.glowColor; ctx.shadowBlur=25;
  ctx.save(); ctx.translate(player.x,player.y);
  const tilt=Math.max(-0.6,Math.min(0.6,player.vy*0.06)); ctx.rotate(tilt);

  const bodyColor = ship.rainbow ? getRainbow(Date.now()*0.002) : ship.color;

  // Cuerpo
  ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.ellipse(0,0,player.size*0.5,player.size,0,0,Math.PI*2); ctx.fill();
  // Cabina
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(0,-player.size); ctx.lineTo(-player.size*0.4,-player.size*0.3); ctx.lineTo(player.size*0.4,-player.size*0.3); ctx.closePath(); ctx.fill();
  // Ventana
  ctx.fillStyle='rgba(6,6,18,0.8)'; ctx.beginPath(); ctx.ellipse(0,-player.size*0.55,player.size*0.15,player.size*0.22,0,0,Math.PI*2); ctx.fill();
  // Alas
  ctx.fillStyle=ship.wingColor;
  ctx.beginPath();ctx.moveTo(-player.size*0.4,player.size*0.3);ctx.lineTo(-player.size*1.2,player.size*0.9);ctx.lineTo(-player.size*0.4,player.size*0.7);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(player.size*0.4,player.size*0.3);ctx.lineTo(player.size*1.2,player.size*0.9);ctx.lineTo(player.size*0.4,player.size*0.7);ctx.closePath();ctx.fill();

  // Llama
  player.engineFlicker=(player.engineFlicker+0.4)%(Math.PI*2);
  const flameSize=10+Math.sin(player.engineFlicker)*5+Math.abs(player.vy)*0.5;
  const fg=ctx.createRadialGradient(0,player.size+flameSize*0.4,0,0,player.size,flameSize*1.6);
  fg.addColorStop(0,ship.flameColors[0]); fg.addColorStop(0.2,ship.flameColors[1]); fg.addColorStop(0.6,ship.flameColors[2]); fg.addColorStop(1,'transparent');
  ctx.fillStyle=fg; ctx.beginPath(); ctx.ellipse(0,player.size+flameSize*0.4,player.size*0.28,flameSize,0,0,Math.PI*2); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=p.color; if(p.glow){ctx.shadowColor=p.color;ctx.shadowBlur=12;} ctx.fill(); ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
}

// Hex to RGB helper
function hexToRgb(hex) {
  hex = hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  if(hex.startsWith('rgba')||hex.startsWith('rgb')) return '0,255,240';
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `${r},${g},${b}`;
}

function checkCollision() {
  const r=player.size*0.62;
  if(player.y-r<0||player.y+r>canvas.height) return true;
  for(const b of barriers) {
    if(player.x+r>b.x&&player.x-r<b.x+BAR_W) {
      if(player.y-r<b.topH||player.y+r>b.bottomY) return true;
    }
  }
  return false;
}

function checkCoinCollection() {
  const r=player.size*0.9;
  coinPickups.forEach(c=>{
    if(c.collected) return;
    const dx=player.x-c.x, dy=player.y-c.y;
    if(Math.sqrt(dx*dx+dy*dy)<r+c.r) {
      c.collected=true;
      spawnParticles(c.x,c.y,'#ffee00',8,0.7);
      awardCoins(1, c.x, c.y);
    }
  });
}

// \u2500\u2500 Main loop \u2500\u2500
function loop() {
  if(screenShake.power>0){
    screenShake.x=(Math.random()-0.5)*screenShake.power;
    screenShake.y=(Math.random()-0.5)*screenShake.power;
    screenShake.power*=0.8;
    if(screenShake.power<0.5){screenShake.power=0;screenShake.x=0;screenShake.y=0;}
  }

  ctx.save();
  if(screenShake.power>0) ctx.translate(screenShake.x,screenShake.y);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();

  if(state==='playing'){
    frame++;

    // ── Base speed progression (every 300 frames) ──
    if(frame%300===0){
      const ns=Math.min(speed+0.3,8);
      if(ns>speed){speed=ns;if(ns===8&&!speedNotifActive){flashScreen('#ffee00',0.25);showSpeedNotif();}}
    }

    // ── Score-based speed phase system ──
    // Cycle every 20 pts: 0-5 normal | 5-10 fast(140%) | 10-15 slow(70%) | 15-20 normal
    const cycleScore = score % 30;
    const phase = cycleScore < 8 ? 0 : cycleScore < 15 ? 1 : cycleScore < 22 ? 2 : 0;
    // music phase 3 = triumphant (22-30), separate from speed phase
    const musicPhase = cycleScore < 15 ? 1 : cycleScore < 22 ? 2 : 3;
    if(phase !== scorePhase){
      scorePhase = phase;
      if(phase === 1){
        targetSpeedMult = 1.2;
        fluctNotif.textContent = '⚡ SPEED UP!';
        fluctNotif.style.cssText = 'color:#ffe600;font-size:22px;text-shadow:0 0 18px #ffaa00,0 0 40px #ff6600;';
        fluctNotif.classList.add('show');
        setTimeout(()=>fluctNotif.classList.remove('show'), 1500);
        flashScreen('#ffee00', 0.2);
      } else if(phase === 2){
        targetSpeedMult = 0.75;
        fluctNotif.textContent = 'SLOW DOWN...';
        fluctNotif.style.cssText = 'color:#00ccff;font-size:22px;text-shadow:0 0 18px #00ccff,0 0 40px #0099ff;';
        fluctNotif.classList.add('show');
        setTimeout(()=>fluctNotif.classList.remove('show'), 1500);
        flashScreen('#00ccff', 0.2);
      } else {
        targetSpeedMult = 1.0;
        fluctNotif.classList.remove('show');
      }
      phaseIndicator.classList.remove('show');
    }
    AudioEngine.setMusicPhase(musicPhase);
    // Smooth lerp toward target multiplier
    speedMult += (targetSpeedMult - speedMult) * 0.05;
    slowMoMult += (targetSlowMoMult - slowMoMult) * 0.04;
    const spd = speed * speedMult * slowMoMult;

    stars.forEach(s=>{s.x-=s.speed*(spd/3.5);s.twinkle+=0.05;if(s.x<0){s.x=canvas.width;s.y=Math.random()*canvas.height;}});
    nebula.forEach(n=>{n.x-=n.speed*(spd/3.5);if(n.x+n.r<0){n.x=canvas.width+n.r;n.y=Math.random()*canvas.height;}});

    const spawnInterval=Math.max(80,130-score*1.5);
    if(frame%Math.floor(spawnInterval)===0) spawnBarrier();


    // Spawn monedas (cada ~200 frames, posici\u00f3n aleatoria)
    if(frame%180===90) spawnCoinPickup();

    if(!player.dead){
      player.vy+=player.gravity; player.y+=player.vy;
      player.trail.push({x:player.x,y:player.y});
      if(player.trail.length>14) player.trail.shift();
    }

    // Update coin pickups
    coinPickups.forEach(c=>{ c.x-=spd; });
    coinPickups=coinPickups.filter(c=>c.x>-20&&!c.collected);

    barriers.forEach(b=>{
      b.x-=spd;
      if(!b.scored&&b.x+BAR_W<player.x){
        b.scored=true; score++; combo++;
        updateUI(); popScore();
        spawnParticles(player.x+20,player.y,currentShip().trailColor,6,0.8);
        if(score===8){setTimeout(()=>{ slowMoMult=0.3; targetSlowMoMult=0.3; showAchieve15(); setTimeout(()=>{ targetSlowMoMult=1.0; },2000); },1500);}
        if(combo>=5&&combo%5===0){AudioEngine.playCombo();showCombo(combo);flashScreen('#ffee00',0.15);}
        else AudioEngine.playScore();
      }
    });
    barriers=barriers.filter(b=>b.x+BAR_W>-20);

    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.97;p.life-=p.decay;});
    particles=particles.filter(p=>p.life>0);

    if(!player.dead){
      checkCoinCollection();
      if(checkCollision()){combo=0;gameOver();}
    }
  }

  barriers.forEach(drawBarrier);
  drawCoinPickups();
  drawParticles();
  drawPlayer();
  ctx.restore();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  REPLAY RECORDER  — rolling 5-second buffer
// ═══════════════════════════════════════════════
const Replay = (() => {
  const CHUNK_MS = 500;
  const MAX_CHUNKS = 11; // chunk[0]=EBML header + last 10 data chunks ≈ 5s

  const MIMES = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
    'video/mp4'
  ];

  let recorder = null, chunks = [], mime = '';

  function start(canvasEl) {
    try {
      chunks = [];
      mime = MIMES.find(m => MediaRecorder.isTypeSupported(m)) || '';
      const stream = canvasEl.captureStream(30);
      const opts = { videoBitsPerSecond: 2_000_000 };
      if (mime) opts.mimeType = mime;
      recorder = new MediaRecorder(stream, opts);
      recorder.ondataavailable = e => {
        if (!e.data || e.data.size === 0) return;
        chunks.push(e.data);
        // Always keep chunk[0] (EBML/container header) + last MAX_CHUNKS-1 chunks
        if (chunks.length > MAX_CHUNKS) {
          chunks = [chunks[0], ...chunks.slice(-(MAX_CHUNKS - 1))];
        }
      };
      recorder.start(CHUNK_MS);
    } catch (err) {
      recorder = null;
    }
  }

  function stop() {
    return new Promise(resolve => {
      if (!recorder || recorder.state === 'inactive') { resolve(null); return; }
      recorder.addEventListener('stop', () => {
        const blob = chunks.length
          ? new Blob(chunks, { type: mime || 'video/webm' })
          : null;
        resolve(blob);
      }, { once: true });
      recorder.stop();
    });
  }

  function reset() {
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (_) {}
    recorder = null; chunks = [];
  }

  return { start, stop, reset };
})();

// ═══════════════════════════════════════════════
//  MOMENT RECORDER  — captures the 3% slow-mo clip
// ═══════════════════════════════════════════════
const MomentRecorder = (() => {
  const MIMES = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  let recorder = null, chunks = [], mime = '', autoTimer = null;

  function start(canvasEl) {
    if (recorder && recorder.state !== 'inactive') return;
    chunks = [];
    try {
      mime = MIMES.find(m => MediaRecorder.isTypeSupported(m)) || '';
      const stream = canvasEl.captureStream(30);
      const opts = { videoBitsPerSecond: 3_000_000 };
      if (mime) opts.mimeType = mime;
      recorder = new MediaRecorder(stream, opts);
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.start(100);
    } catch(_) { recorder = null; }
  }

  function stop() {
    return new Promise(resolve => {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      if (!recorder || recorder.state === 'inactive') { resolve(null); return; }
      recorder.addEventListener('stop', () => {
        const blob = chunks.length ? new Blob(chunks, { type: mime || 'video/webm' }) : null;
        recorder = null; chunks = [];
        resolve(blob);
      }, { once: true });
      recorder.stop();
    });
  }

  function capture(canvasEl, ms, cb) {
    start(canvasEl);
    autoTimer = setTimeout(() => stop().then(cb), ms);
  }

  return { capture, stop };
})();

// ═══════════════════════════════════════════════
//  CLIP COMPOSITOR  — bakes text overlays into the 3% moment clip
// ═══════════════════════════════════════════════
function drawOverlayText(ctx, W, H) {
  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // Subtle dark gradient at top for title readability
  const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.18);
  topGrad.addColorStop(0, 'rgba(0,0,0,0.72)');
  topGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = topGrad; ctx.fillRect(0, 0, W, H * 0.18);

  // Subtle dark gradient at bottom for URL/CTA readability
  const botGrad = ctx.createLinearGradient(0, H * 0.68, 0, H);
  botGrad.addColorStop(0, 'rgba(0,0,0,0)');
  botGrad.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle = botGrad; ctx.fillRect(0, H * 0.68, W, H * 0.32);

  // NEON DASH — top center, cyan glow
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(W * 0.1)}px Orbitron, monospace`;
  ctx.fillStyle = '#00fff0';
  ctx.shadowColor = '#00fff0'; ctx.shadowBlur = 32;
  ctx.fillText('NEON DASH', W / 2, H * 0.1);
  ctx.shadowBlur = 14;
  ctx.fillText('NEON DASH', W / 2, H * 0.1); // double-draw to boost glow

  // "ONLY 3% REACH THIS." — middle-lower
  ctx.font = `900 ${Math.round(W * 0.057)}px Orbitron, monospace`;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#00fff0'; ctx.shadowBlur = 20;
  ctx.fillText('ONLY 3% REACH THIS.', W / 2, H * 0.75);

  // "neondash.games" — bottom center
  ctx.font = `700 ${Math.round(W * 0.039)}px Orbitron, monospace`;
  ctx.fillStyle = 'rgba(0,255,240,0.92)';
  ctx.shadowColor = '#00fff0'; ctx.shadowBlur = 14;
  ctx.fillText('neondash.games', W / 2, H * 0.91);

  // "CAN YOU BEAT THIS?" — bottom right, small
  ctx.textAlign = 'right';
  ctx.font = `700 ${Math.round(W * 0.029)}px Orbitron, monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 5;
  ctx.fillText('CAN YOU BEAT THIS?', W - Math.round(W * 0.04), H * 0.97);

  ctx.restore();
}

function composeClip(sourceBlob) {
  return new Promise(resolve => {
    const vid = document.createElement('video');
    vid.muted = true; vid.playsInline = true;
    const blobUrl = URL.createObjectURL(sourceBlob);
    vid.src = blobUrl;

    const fallback = () => { URL.revokeObjectURL(blobUrl); resolve(sourceBlob); };
    vid.onerror = fallback;

    vid.onloadedmetadata = () => {
      const W = vid.videoWidth  || canvas.width;
      const H = vid.videoHeight || canvas.height;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');

      const MIMES = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
      const mime = MIMES.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
      const recorder = new MediaRecorder(cvs.captureStream(30), { mimeType: mime, videoBitsPerSecond: 4_000_000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => { URL.revokeObjectURL(blobUrl); resolve(chunks.length ? new Blob(chunks, { type: mime }) : sourceBlob); };

      let rafId;
      function drawFrame() {
        ctx.drawImage(vid, 0, 0, W, H);
        drawOverlayText(ctx, W, H);
        rafId = requestAnimationFrame(drawFrame);
      }
      vid.onended = () => { cancelAnimationFrame(rafId); if (recorder.state !== 'inactive') recorder.stop(); };
      vid.onplay  = () => { recorder.start(100); rafId = requestAnimationFrame(drawFrame); };
      vid.play().catch(fallback);
    };
  });
}

  a.download = `neon-dash.${ext}`;
  a.click();
});

// ── WOW TIKTOK MOMENT → composite overlays then show clip ──
document.getElementById('share3pctBtn').addEventListener('click', async e => {
  e.stopPropagation();
  if (!momentBlob) return;
  const btn = document.getElementById('share3pctBtn');
  btn.textContent = '⏳ RENDERING...';
  btn.disabled = true;
  const composited = await composeClip(momentBlob);
  btn.textContent = '🎬 WOW TIKTOK MOMENT';
  btn.disabled = false;
  overlayBlob = composited;
  const vid = document.getElementById('replayVideo');
  vid.src = URL.createObjectURL(overlayBlob);
  vid.play().catch(() => {});
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('replayOverlay').classList.remove('hidden');
});

// ── PLAY AGAIN from replay overlay ──
document.getElementById('rvPlayAgainBtn').addEventListener('click', e => {
  e.stopPropagation();
  startGame();
});
</script>

<style>
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</body>
